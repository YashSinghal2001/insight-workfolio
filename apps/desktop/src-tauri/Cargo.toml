[package]
name = "insight-workfolio-desktop"
version = "0.1.0"
description = "Insight Workfolio desktop client"
edition = "2024"
publish = false

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "insight_workfolio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential store: macOS Keychain, Windows Credential Manager.
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
# Offline attendance queue. Bundled SQLite: same engine on macOS and Windows.
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Screenshots: lossy WebP via libwebp (compiled from source by libwebp-sys), SHA-256 checksums.
webp = { version = "0.3", default-features = false }
sha2 = "0.10"

# libwebp is C code: unoptimized it takes seconds per screenshot even in development builds.
[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Foreground application name/bundle ID (NSWorkspace) and lock state: no Accessibility or
# Screen Recording permission is needed for these APIs. Screenshots use ScreenCaptureKit
# (macOS 14+) and require the Screen Recording permission, granted by the user in System Settings.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSArray"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCScreenshotManager", "SCStream", "SCError"] }
