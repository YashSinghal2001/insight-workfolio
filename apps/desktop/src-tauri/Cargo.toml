[package]
name = "insight-workfolio-desktop"
version = "0.2.1"
description = "Insight Workfolio desktop client"
edition = "2024"
publish = false

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (cargo#8519).
name = "insight_workfolio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: menu-bar item; image-png: its template icon (icons/tray-template.png).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# OS notifications for state changes only (sync blocked, screenshot uploads failing): src/notify.ts.
tauri-plugin-notification = "=2.8.0"
# In-app updates (docs/desktop/AUTO-UPDATE-ARCHITECTURE.md): minisign-verified packages from the API's manifest.
# Registered only when the build config has plugins.updater (scripts/desktop-config.mjs adds it for signed releases).
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential store: macOS Keychain, Windows Credential Manager.
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
# Offline attendance queue. Bundled SQLite: same engine on macOS and Windows.
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Screenshots: lossy WebP via libwebp (compiled from source by libwebp-sys), SHA-256 checksums.
webp = { version = "0.3", default-features = false }
sha2 = "0.10"
# Parses the ISO `since` time of the menu-bar timer (already in the dependency tree).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# libwebp is C code: unoptimized it takes seconds per screenshot even in development builds.
[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Foreground application name/bundle ID (NSWorkspace) and lock state: no Accessibility or
# Screen Recording permission is needed for these APIs. Screenshots use ScreenCaptureKit
# (macOS 14+) and require the Screen Recording permission, granted by the user in System Settings.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows native adapters (activity, session/power events, screenshots, startup, single instance).
# Same windows-sys version Tauri already pulls in, so nothing extra is compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Second launch → focus the running copy (named mutex + WM_COPYDATA to the first instance).
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSArray", "NSNotification", "NSDistributedNotificationCenter", "NSProcessInfo"] }
# Launch at login: SMAppService (macOS 13+), listed in System Settings > General > Login Items.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "SCShareableContent", "SCScreenshotManager", "SCStream", "SCError"] }
