# Persistent directory layout on the VPS. Installed at /etc/tmpfiles.d/workfolio.conf; created with
# `systemd-tmpfiles --create workfolio.conf` and re-checked at every boot. systemd-tmpfiles-clean.timer (daily)
# applies the Age column: only the timelapse scratch directory has one (a job never runs longer than 15 min,
# so a file older than 2 days is an orphan).
#
# Type Path                              Mode User      Group     Age
d      /opt/workfolio                    0755 workfolio workfolio -
d      /opt/workfolio/releases           0755 workfolio workfolio -
d      /etc/workfolio                    0750 root      workfolio -
d      /var/lib/workfolio                0750 workfolio workfolio -
d      /var/lib/workfolio/db             0700 workfolio workfolio -
d      /var/lib/workfolio/secrets        0700 workfolio workfolio -
d      /var/lib/workfolio/tmp            0700 workfolio workfolio -
d      /var/lib/workfolio/tmp/timelapses 0700 workfolio workfolio 2d
d      /var/lib/workfolio/monitor        0700 workfolio workfolio -
d      /var/backups/workfolio            0700 workfolio workfolio -
