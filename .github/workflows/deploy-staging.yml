# Staging deploy. NEVER RUN YET: no remote, no Render/Vercel accounts, no GitHub `staging` environment
# or secrets exist (docs/deployment.md). The Turso staging database exists but has not been migrated by
# this workflow.
# Runs after CI passes on main. The job uses the `staging` GitHub environment, which must be configured
# with required reviewers (Settings › Environments › staging), so nothing reaches staging without a
# person approving it. Secrets are referenced by name only; set them on that environment:
#   STAGING_DATABASE_URL, STAGING_DATABASE_AUTH_TOKEN, RENDER_DEPLOY_HOOK_URL, VERCEL_DEPLOY_HOOK_URL
# and one non-secret variable (repository or `staging` environment variable):
#   STAGING_DATABASE_HOST  the expected Turso host, e.g. workfolio-<org>.aws-ap-south-1.turso.io
# Order: wrong-database guard -> dry run -> migrate (approved) -> read-only verify -> Render deploy hook
# (API) -> Vercel deploy hook (dashboard). Hosted API boots never migrate: they verify the schema and
# refuse to start while a migration is pending, so this job must migrate before the deploy hooks.
# Before a migration-bearing deploy, take a dump first (pnpm --filter @workfolio/api db:dump, from a
# trusted machine; docs/database-operations.md). The dump holds personal data, so it is not done here.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate staging database, then deploy (approval required)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # exactly the commit CI checked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @workfolio/api build
      # Refuse to touch a database other than the expected staging one (e.g. a production URL pasted
      # into the staging secret). The expected host is a plain variable, not a secret. Only the expected
      # host is printed; the secret URL is never echoed.
      - name: Wrong-database guard
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
        run: |
          if [ -z "$EXPECTED_DATABASE_HOST" ]; then
            echo "::error::vars.STAGING_DATABASE_HOST is not set; refusing to migrate."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::secrets.STAGING_DATABASE_URL is not set; refusing to migrate."
            exit 1
          fi
          case "$DATABASE_URL" in
            libsql://*|https://*) ;;
            *) echo "::error::STAGING_DATABASE_URL must be libsql:// or https://; refusing to migrate."; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *\?*|*@*) echo "::error::STAGING_DATABASE_URL must not contain credentials or a query string; refusing to migrate."; exit 1 ;;
          esac
          host="${DATABASE_URL#*://}"
          host="${host%%/*}"
          host="${host%%\?*}"
          host="${host##*@}"
          host="${host%%:*}"
          if [ "$host" != "$EXPECTED_DATABASE_HOST" ]; then
            echo "::error::STAGING_DATABASE_URL does not point at the expected host ($EXPECTED_DATABASE_HOST); refusing to migrate."
            exit 1
          fi
          echo "Database host matches $EXPECTED_DATABASE_HOST."
      # NODE_ENV stays unset (development): db:migrate validates only the database settings it uses.
      - name: Dry run (lists pending migrations, checks applied checksums)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.STAGING_DATABASE_AUTH_TOKEN }}
        run: pnpm --filter @workfolio/api db:migrate --dry-run
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.STAGING_DATABASE_AUTH_TOKEN }}
        run: pnpm --filter @workfolio/api db:migrate
      # Read-only check that the schema now matches this build (0 pending, integrity and FK clean).
      # verify-turso.mjs reads only an env file, never process.env, so write one from the secrets:
      # owner-only (umask 077), inside $RUNNER_TEMP, values written with printf (never echoed),
      # and deleted even when the verifier fails.
      - name: Verify schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.STAGING_DATABASE_AUTH_TOKEN }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/staging.env"
          trap 'rm -f "$env_file"' EXIT
          printf 'DATABASE_URL=%s\nDATABASE_AUTH_TOKEN=%s\n' "$DATABASE_URL" "$DATABASE_AUTH_TOKEN" > "$env_file"
          pnpm --filter @workfolio/api verify:turso "$env_file"
      # Same job, so one approval covers migrate + verify + deploy, and a failed step stops here.
      # Hooks build the branch head (not head_sha); concurrency above keeps runs in order.
      # Hook URLs are secrets (anyone holding one can trigger a deploy): never echo them.
      - name: Render deploy hook (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --output /dev/null -X POST "$HOOK"
      - name: Vercel deploy hook (dashboard)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --output /dev/null -X POST "$HOOK"
