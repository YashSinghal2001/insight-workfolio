# Publish a desktop release to the VPS (docs/desktop/DESKTOP-PUBLISH-PIPELINE.md): installers for the dashboard's
# Desktop app card, plus the in-app updater packages and their signatures.
#
# PRODUCTION: pushing an approved tag `desktop-vX.Y.Z` whose commit is on deploy/hostinger-vps. Release notes
#   are the annotated tag's message (`git tag -a desktop-vX.Y.Z -m "..."`).
#     build + tests + signing + verification of both platforms (desktop-build.yml, environment `production`)
#     -> manual approval (environment `desktop-downloads`: required reviewers; it holds ONLY the production SSH key)
#     -> publish
# TEST: Actions > Desktop publish (VPS downloads) > Run workflow, on any branch. Builds the unsigned
#   "Insight Workfolio Test" app (placeholder API, no secrets, throwaway updater key) and publishes it to the
#   separate test folder with the separate test key (environment `desktop-downloads-test`). Nothing of it is
#   shown on the dashboard. It rehearses exactly the production path below.
#
# Publish = all or nothing (deploy/scripts/desktop-publish.sh): it starts only when BOTH platforms built and
# verified; uploads every file to the restricted receiver (never overwrites); downloads each one again over
# public https and compares SHA-256; only then switches the manifest to both installers in one atomic write;
# then reads the public manifest and downloads through the links it publishes. A failure at any step leaves
# the published release exactly as it was.
#
# Never: root SSH, a shell on the VPS, a dashboard/API deploy, a service restart, a database migration.
#
# Environments (each: secrets DESKTOP_PUBLISH_SSH_KEY = ed25519 private key of that channel's publisher,
# DESKTOP_PUBLISH_KNOWN_HOSTS = the VPS host key line, host key checking is strict; variables
# DESKTOP_DOWNLOADS_ORIGIN = https://189.72.144.117, DESKTOP_PUBLISH_SSH_TARGET):
#   desktop-downloads       workfolio-publisher@189.72.144.117       required reviewers, tags desktop-v* only
#   desktop-downloads-test  workfolio-publisher-test@189.72.144.117  its key can write only the test folder
name: Desktop publish (VPS downloads)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "TEST build: upload it to the VPS test folder (off = build and verify only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-publish-${{ github.event_name == 'push' && 'production' || 'test' }}
  cancel-in-progress: false

jobs:
  guard:
    name: Channel, version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$TAG" =~ ^desktop-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]] || { echo "::error::tag $TAG is not desktop-vMAJOR.MINOR.PATCH"; exit 1; }
            version=${BASH_REMATCH[1]}
            git merge-base --is-ancestor "$GITHUB_SHA" origin/deploy/hostinger-vps \
              || { echo "::error::$GITHUB_SHA is not on deploy/hostinger-vps; only production commits are published"; exit 1; }
            # actions/checkout stores an annotated tag as a plain ref: fetch the tag object for its message.
            git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then git tag -l --format='%(contents)' "$TAG" > notes.txt; else : > notes.txt; fi
            echo "channel=production" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
            printf 'TEST build of %s (%s), run %s. Unsigned separate app "Insight Workfolio Test"; it cannot reach any server.\n' \
              "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > notes.txt
            echo "channel=test" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.txt

  # Two callers on purpose: only the production build is handed secrets. A TEST build cannot see any.
  build:
    if: github.event_name == 'push'
    needs: guard
    uses: ./.github/workflows/desktop-build.yml
    with:
      environment: production
      version: ${{ needs.guard.outputs.version }}
      macos_universal: true
    secrets: inherit

  build-test:
    if: github.event_name == 'workflow_dispatch'
    needs: guard
    uses: ./.github/workflows/desktop-build.yml
    with:
      environment: test
      version: ${{ needs.guard.outputs.version }}
      macos_universal: true

  publish:
    name: Publish (${{ needs.guard.outputs.channel }})
    needs: [guard, build, build-test]
    # A build is `success` only when BOTH platforms built and verified: one failed platform publishes nothing.
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.build.result == 'success' || (needs.build-test.result == 'success' && inputs.publish)) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.guard.outputs.channel == 'production' && 'desktop-downloads' || 'desktop-downloads-test' }}
    timeout-minutes: 30
    env:
      CHANNEL: ${{ needs.guard.outputs.channel }}
      VERSION: ${{ needs.guard.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-${{ needs.guard.outputs.channel }}-${{ needs.guard.outputs.version }}-*
          path: in
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Publish
        env:
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ github.sha }}
          NOTES_FILE: notes/notes.txt
          DESKTOP_DOWNLOADS_ORIGIN: ${{ vars.DESKTOP_DOWNLOADS_ORIGIN }}
          DESKTOP_PUBLISH_SSH_TARGET: ${{ vars.DESKTOP_PUBLISH_SSH_TARGET }}
          SSH_KEY: ${{ secrets.DESKTOP_PUBLISH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DESKTOP_PUBLISH_KNOWN_HOSTS }}
        run: |
          umask 077
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::this environment has no DESKTOP_PUBLISH_SSH_KEY / DESKTOP_PUBLISH_KNOWN_HOSTS: the VPS publisher is not set up yet (docs/desktop/DESKTOP-PUBLISH-PIPELINE.md, One-time setup)"; exit 1
          fi
          export DESKTOP_PUBLISH_SSH_KEY_FILE="$RUNNER_TEMP/publish_key" DESKTOP_PUBLISH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$DESKTOP_PUBLISH_SSH_KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$DESKTOP_PUBLISH_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$DESKTOP_PUBLISH_KNOWN_HOSTS_FILE"
          bash deploy/scripts/desktop-publish.sh "$RUNNER_TEMP/result.json" in/*/
      - name: Release report
        if: ${{ always() }}
        run: |
          [ -f "$RUNNER_TEMP/result.json" ] || jq -n --arg ch "$CHANNEL" --arg v "$VERSION" --arg c "$GITHUB_SHA" \
            '{channel:$ch, version:$v, commit:$c, status:"not published (stopped before the publish script ran)", files:[]}' > "$RUNNER_TEMP/result.json"
          jq --arg run "$RUN_URL" --arg ref "$GITHUB_REF_NAME" '. + {ref:$ref, run:$run}' "$RUNNER_TEMP/result.json" > release-report.json
          {
            echo "## Desktop release report: $CHANNEL $VERSION ($GITHUB_REF_NAME)"
            echo "Commit \`$GITHUB_SHA\` · [run]($RUN_URL) · status: **$(jq -r .status release-report.json)**"
            echo
            echo "| Platform | Kind | File | Bytes | SHA-256 | URL |"
            echo "|---|---|---|---|---|---|"
            jq -r '.files | sort_by(.platform, .kind)[] | "| \(.platform) | \(.kind) | \(.file) | \(.sizeBytes) | `\(.sha256)` | \(.url) |"' release-report.json
          } | tee release-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-report-${{ needs.guard.outputs.channel }}-${{ needs.guard.outputs.version }}
          path: |
            release-report.json
            release-report.md
