# CI: validation plus UNSIGNED desktop installers. No secrets, no environments, no deploys, no release, no
# network to Microsoft/Turso/Render/Vercel/the VPS. The repository is public: logs and artifacts of every run
# can be downloaded by any signed-in GitHub user, so nothing here may ever carry a secret.
#
# What runs when (docs/deployment.md, "CI installers"):
#   push to ANY branch (`branches: ["**"]`: every branch name, no tags)
#       checks + macOS + Windows, both installers, and the `installers` gate
#   pull request (any branch)
#       the same checks and tests on the merge result, no installers (validation only; installers come from
#       pushes to branches of this repository)
#   manual (Actions > CI > Run workflow, any branch)
#       as a push, plus the browser suites; desktop_api_url packages a real server instead of the placeholder
# No path filter: a push that changes only documentation builds both installers too.
# A push runs the ci.yml of the pushed branch: a branch gets this behaviour once it contains this file.
# Tags start nothing here (desktop-v* tags belong to desktop-publish.yml, the signed production path).
#
# Installers: one Windows x64 NSIS .exe and one macOS universal (Apple Silicon + Intel) .dmg per run, each in
# its own artifact with <installer>.sha256 and build-metadata.json, kept 14 days:
#   insight-workfolio_<version>_<platform>-<arch>_UNSIGNED-<TEST|QA>_run<run id>-<attempt>
# The installer file inside carries the same _UNSIGNED-<TEST|QA> suffix.
# TEST = the reserved placeholder https://api.example.invalid (RFC 2606): it can never resolve, so that
# installer cannot talk to any server. It is a separate app, "Insight Workfolio Test"
# (com.insightworkfolio.desktop.test: desktop-config.mjs gives every placeholder build that identity), with its
# own install folder, data, credentials and sign-in entry, so installing it never touches a real install.
# QA = the https API URL given to a manual run; it keeps the production identity, as before.
# Both are unsigned, not notarized and have no in-app updater: for testing, never for distribution (signed
# builds: desktop-build.yml).
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      # Set both to build the installers for a real server instead of the placeholder (still unsigned).
      # Public https URLs, not secrets. The browser suites are skipped on such a run.
      desktop_api_url:
        description: "Desktop installers: https API URL to package (empty = placeholder test build)"
        required: false
        default: ""
      desktop_dashboard_url:
        description: "Desktop installers: https dashboard URL shown to administrators"
        required: false
        default: ""

permissions:
  contents: read

# Pull requests: one group per PR, a newer commit cancels the older validation run.
# Push and manual runs: a group of their own, so nothing ever cancels an installer build: not a manual run on
# the same branch (that cancelled the push run of 0f6dd86 on 2026-11-18), not a newer push, not another branch.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What the installers talk to. An API URL without its dashboard URL fails the build (desktop-config.mjs);
  # the placeholder gets the placeholder dashboard there.
  DESKTOP_API_URL: ${{ inputs.desktop_api_url || 'https://api.example.invalid' }}
  DESKTOP_DASHBOARD_URL: ${{ inputs.desktop_api_url && inputs.desktop_dashboard_url || '' }}

jobs:
  checks:
    name: Lint, typecheck, tests, dashboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines: node >=24.7
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      # Desktop's own lint script also runs cargo clippy; that part is in the macOS job.
      - name: Lint
        run: |
          pnpm -r --filter '!@workfolio/desktop' lint
          pnpm --filter @workfolio/desktop exec eslint src test
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Dashboard unit tests
        run: pnpm --filter @workfolio/dashboard test:unit

      - name: Test packages/shared
        run: pnpm --filter @workfolio/shared test
      - name: Test packages/database
        run: pnpm --filter @workfolio/database test
      - name: Test apps/api
        run: pnpm --filter @workfolio/api test
      - name: Test browser extension
        run: pnpm --filter @workfolio/browser-extension test
      - name: Test desktop (TypeScript only)
        run: pnpm --filter @workfolio/desktop exec node --test
      - name: Installer script lint and gate self-test (the cases the `installers` job must reject)
        run: |
          shellcheck deploy/scripts/ci-desktop-installer.sh
          bash deploy/scripts/ci-desktop-installer.sh selftest

      # Next 16.4 intermittently aborts the build with a SecurityFatalError nudge; one retry.
      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000 # next build refuses it unset (next.config.ts)
        run: pnpm exec next build || pnpm exec next build
      - name: Dashboard smoke
        working-directory: apps/dashboard
        run: node scripts/smoke.mjs

  # macOS desktop: clippy and tests, then (not on pull requests) the UNSIGNED DMG. One job, like
  # windows-desktop, so the macOS runner sets up, compiles and tests once.
  # Universal = one app holding an arm64 and an x86_64 slice, the target desktop-publish.yml ships. Both slices
  # are checked from the built bytes (lipo); neither is launched here, and the Intel slice has not been run on
  # Intel hardware by CI.
  macos-desktop:
    name: macOS desktop (cargo test + clippy, unsigned universal DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.installer.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Every branch restores main's cache; only main saves (the 10 GB repository cache limit is close).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # tauri::generate_context! embeds frontendDist (apps/desktop/dist): it must exist to compile.
      - run: pnpm --filter @workfolio/desktop build
      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # No APPLE_* variables: ad-hoc linker signature only, not notarized. No WORKFOLIO_UPDATER_PUBKEY: no updater.
      - name: Build UNSIGNED universal DMG (placeholder API URL unless desktop_api_url is given)
        if: github.event_name != 'pull_request'
        env:
          WORKFOLIO_API_URL: ${{ env.DESKTOP_API_URL }}
          WORKFOLIO_DASHBOARD_URL: ${{ env.DESKTOP_DASHBOARD_URL }}
        run: pnpm --filter @workfolio/desktop package -- --bundles app,dmg --target universal-apple-darwin
      # Version, app name, bundle identifier (the test one for a placeholder build), both architectures and the
      # packaged API origin read from the app inside the DMG.
      - name: Verify DMG from its bytes, write SHA-256 and build metadata
        id: installer
        if: github.event_name != 'pull_request'
        env:
          API_URL: ${{ env.DESKTOP_API_URL }}
          MAC_TARGET: universal
        run: bash deploy/scripts/ci-desktop-installer.sh macos
      - name: Upload unsigned DMG, SHA-256 and metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Run id + attempt: every run (and re-run) gets its own artifact; nothing is ever replaced.
          name: ${{ steps.installer.outputs.artifact }}
          path: qa/
          if-no-files-found: error
          retention-days: 14

  browser-suites:
    name: Browser suites (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_api_url == ''
    # verify-*.mjs hardcode /Applications/Google Chrome.app (preinstalled on GitHub macOS runners).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: brew install ffmpeg # verify-masks and verify-timelapse need FFmpeg with libx264
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @workfolio/api build
      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000 # next build refuses it unset (next.config.ts)
        run: pnpm exec next build || pnpm exec next build
      # Each suite runs even if an earlier one failed, so one run reports all of them.
      - name: verify:web-app
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:web-app
      - name: verify:my-panel
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:my-panel
      - name: verify:gallery
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:gallery
      - name: verify:timelapse
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:timelapse
      - name: verify:masks
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:masks
      - name: verify:reports
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:reports

  # Windows desktop: real Windows Server, so the cfg(windows) native smoke tests (activity sampling,
  # session-event thread, GDI capture in memory, EcoQoS opt-out) actually run here. MSVC toolchain.
  windows-desktop:
    name: Windows desktop (cargo test + clippy, unsigned NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.installer.outputs.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable # x86_64-pc-windows-msvc on windows-latest
        with:
          components: clippy
      # Every branch restores main's cache; only main saves (the 10 GB repository cache limit is close).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # tauri::generate_context! embeds frontendDist (apps/desktop/dist): it must exist to compile.
      - run: pnpm --filter @workfolio/desktop build
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (includes the Windows native smoke tests)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Test desktop (TypeScript)
        run: pnpm --filter @workfolio/desktop exec node --test
      # No WINDOWS_*/AZURE_* variables: unsigned, SmartScreen warns. No WORKFOLIO_UPDATER_PUBKEY: no updater.
      - name: Build UNSIGNED NSIS installer (placeholder API URL unless desktop_api_url is given)
        if: github.event_name != 'pull_request'
        env:
          WORKFOLIO_API_URL: ${{ env.DESKTOP_API_URL }}
          WORKFOLIO_DASHBOARD_URL: ${{ env.DESKTOP_DASHBOARD_URL }}
        run: pnpm --filter @workfolio/desktop package -- --bundles nsis
      # Installer and app version and x86_64 read from the built bytes (verify-windows-installer.ps1, as
      # desktop-build.yml); the app binary must name the requested API origin, never the dev API, and hold the
      # expected identifier (the test one for a placeholder build).
      - name: Verify installer from its bytes, write SHA-256 and build metadata
        id: installer
        if: github.event_name != 'pull_request'
        env:
          API_URL: ${{ env.DESKTOP_API_URL }}
        run: bash deploy/scripts/ci-desktop-installer.sh windows
      - name: Upload unsigned NSIS installer, SHA-256 and metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.artifact }}
          path: qa/
          if-no-files-found: error
          retention-days: 14

  # The run is green only when BOTH installers exist for this commit. A platform job that failed, was skipped by
  # a condition or uploaded nothing fails this job, which downloads the two artifacts as a user would and
  # re-checks commit, size and SHA-256 (the summary table lists them). Artifact names come from the job outputs,
  # so "Re-run failed jobs" pairs the new artifact with the one the passing job uploaded earlier.
  installers:
    name: Installers (Windows + macOS present and verified)
    needs: [macos-desktop, windows-desktop]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MACOS_RESULT: ${{ needs.macos-desktop.result }}
      MACOS_ARTIFACT: ${{ needs.macos-desktop.outputs.artifact }}
      WINDOWS_RESULT: ${{ needs.windows-desktop.result }}
      WINDOWS_ARTIFACT: ${{ needs.windows-desktop.outputs.artifact }}
    steps:
      - name: Both platform jobs succeeded and named an artifact
        run: |
          echo "macOS: $MACOS_RESULT ${MACOS_ARTIFACT:-(no artifact)}"
          echo "Windows: $WINDOWS_RESULT ${WINDOWS_ARTIFACT:-(no artifact)}"
          if [ "$MACOS_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ] || [ -z "$MACOS_ARTIFACT" ] || [ -z "$WINDOWS_ARTIFACT" ]; then
            echo "::error::not every installer was built: macOS job $MACOS_RESULT, Windows job $WINDOWS_RESULT"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos-desktop.outputs.artifact }}
          path: installers/macos
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-desktop.outputs.artifact }}
          path: installers/windows
      - name: Both installers built from this commit, sizes and SHA-256 match
        run: bash deploy/scripts/ci-desktop-installer.sh gate installers
