# CI for the private repo. No secrets, no deploys, no network to Microsoft/Turso/Render/Vercel.
# Browser suites (headless Chrome at the macOS path + FFmpeg) run only on manual dispatch.
name: CI

on:
  pull_request:
  push:
    # The feature branch gets an automatic unsigned Windows QA installer (windows-desktop job) on every push.
    branches: [main, feature/windows-screen-lock-break]
  workflow_dispatch:
    inputs:
      # Set both to build the Windows installer for a real server instead of the placeholder (still unsigned).
      # Public https URLs, not secrets. The browser suites are skipped on such a run.
      desktop_api_url:
        description: "Windows installer: https API URL to package (empty = placeholder test build)"
        required: false
        default: ""
      desktop_dashboard_url:
        description: "Windows installer: https dashboard URL shown to administrators"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, dashboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines: node >=24.7
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      # Desktop's own lint script also runs cargo clippy; that part is in the macOS job.
      - name: Lint
        run: |
          pnpm -r --filter '!@workfolio/desktop' lint
          pnpm --filter @workfolio/desktop exec eslint src test
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test packages/shared
        run: pnpm --filter @workfolio/shared test
      - name: Test packages/database
        run: pnpm --filter @workfolio/database test
      - name: Test apps/api
        run: pnpm --filter @workfolio/api test
      - name: Test browser extension
        run: pnpm --filter @workfolio/browser-extension test
      - name: Test desktop (TypeScript only)
        run: pnpm --filter @workfolio/desktop exec node --test

      # Next 16.4 intermittently aborts the build with a SecurityFatalError nudge; one retry.
      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000 # next build refuses it unset (next.config.ts)
        run: pnpm exec next build || pnpm exec next build
      - name: Dashboard smoke
        working-directory: apps/dashboard
        run: node scripts/smoke.mjs

  desktop-rust:
    name: Desktop Rust (cargo test + clippy)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # tauri::generate_context! embeds frontendDist (apps/desktop/dist): it must exist to compile.
      - run: pnpm --filter @workfolio/desktop build
      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  browser-suites:
    name: Browser suites (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_api_url == ''
    # verify-*.mjs hardcode /Applications/Google Chrome.app (preinstalled on GitHub macOS runners).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: brew install ffmpeg # verify-masks and verify-timelapse need FFmpeg with libx264
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @workfolio/api build
      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000 # next build refuses it unset (next.config.ts)
        run: pnpm exec next build || pnpm exec next build
      # Each suite runs even if an earlier one failed, so one run reports all of them.
      - name: verify:web-app
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:web-app
      - name: verify:my-panel
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:my-panel
      - name: verify:gallery
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:gallery
      - name: verify:timelapse
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:timelapse
      - name: verify:masks
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:masks
      - name: verify:reports
        if: ${{ !cancelled() }}
        run: pnpm --filter @workfolio/dashboard verify:reports

  # Windows desktop: real Windows Server, so the cfg(windows) native smoke tests (activity sampling,
  # session-event thread, GDI capture in memory, EcoQoS opt-out) actually run here. MSVC toolchain.
  windows-desktop:
    name: Windows desktop (cargo test + clippy, unsigned NSIS test installer)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable # x86_64-pc-windows-msvc on windows-latest
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # tauri::generate_context! embeds frontendDist (apps/desktop/dist): it must exist to compile.
      - run: pnpm --filter @workfolio/desktop build
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (includes the Windows native smoke tests)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Test desktop (TypeScript)
        run: pnpm --filter @workfolio/desktop exec node --test
      # Default: placeholder API on the reserved .invalid TLD (RFC 2606): it can never resolve, so that
      # installer cannot talk to any real server. A manual run with desktop_api_url packages that server
      # instead. Unsigned either way (no WINDOWS_*/AZURE_* variables).
      - name: Build UNSIGNED NSIS installer (placeholder API URL unless desktop_api_url is given)
        env:
          WORKFOLIO_API_URL: ${{ inputs.desktop_api_url || 'https://api.example.invalid' }}
          WORKFOLIO_DASHBOARD_URL: ${{ inputs.desktop_dashboard_url || (inputs.desktop_api_url && 'missing') || 'https://app.example.invalid' }}
        run: pnpm --filter @workfolio/desktop package -- --bundles nsis
      # The packaged front end and the app binary (CSP connect-src) must name the requested origin; the
      # binary must name neither the dev API nor, on a real build, the placeholder.
      - name: Verify packaged API URL, print size and SHA-256
        env:
          API_URL: ${{ inputs.desktop_api_url || 'https://api.example.invalid' }}
        run: |
          origin=$(node -e 'console.log(new URL(process.env.API_URL).origin)')
          grep -rqF "$origin" apps/desktop/dist/assets
          grep -aqF "$origin" apps/desktop/src-tauri/target/release/*.exe
          if grep -aqF "localhost:4000" apps/desktop/src-tauri/target/release/*.exe; then
            echo "::error::app binary contains the dev API localhost:4000"; exit 1
          fi
          if [ "$origin" != "https://api.example.invalid" ] && grep -aqF "example.invalid" apps/desktop/src-tauri/target/release/*.exe; then
            echo "::error::real-server build still contains the example.invalid placeholder"; exit 1
          fi
          echo "packaged API origin: $origin"
          ls -l apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          sha256sum apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      # Version and x86_64 read from the built bytes (same verifier as desktop-build.yml), then the installer,
      # its SHA-256 file and build metadata go into one artifact.
      - name: Verify installer version and x64, write checksum and build metadata
        env:
          API_URL: ${{ inputs.desktop_api_url || 'https://api.example.invalid' }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          v=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          exes=(apps/desktop/src-tauri/target/release/bundle/nsis/*_"$v"_x64-setup.exe)
          [ ${#exes[@]} = 1 ] && [ -f "${exes[0]}" ] || { echo "expected exactly one x64 installer for $v: ${exes[*]}"; exit 1; }
          pwsh -NoProfile -File deploy/scripts/verify-windows-installer.ps1 -Installer "${exes[0]}" \
            -App apps/desktop/src-tauri/target/release/insight-workfolio-desktop.exe -Version "$v"
          mkdir -p qa && cp "${exes[0]}" qa/
          cd qa && f=$(basename "${exes[0]}")
          sha256sum "$f" | tee "$f.sha256"
          VERSION=$v FILE=$f node -e '
            const fs = require("fs"), crypto = require("crypto"), e = process.env;
            const bytes = fs.readFileSync(e.FILE);
            fs.writeFileSync("build-metadata.json", JSON.stringify({ platform: "windows", file: e.FILE, version: e.VERSION,
              arch: "x86_64", sizeBytes: bytes.length, sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
              signed: false, apiUrl: e.API_URL, commit: e.COMMIT, ref: e.REF, runId: e.RUN_ID }, null, 2) + "\n");'
          cat build-metadata.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned NSIS installer, checksum and metadata
        uses: actions/upload-artifact@v4
        with:
          # Run id + attempt: every run (and re-run) gets its own artifact; nothing is ever replaced.
          name: ${{ inputs.desktop_api_url && 'insight-workfolio-windows-nsis-UNSIGNED' || 'insight-workfolio-windows-nsis-UNSIGNED-TEST-ONLY' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/
          if-no-files-found: error
          retention-days: 14
