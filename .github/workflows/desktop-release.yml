# Desktop release candidate (docs/desktop/AUTO-UPDATE-RELEASE-GUIDE.md). Manual only: a push never builds
# or publishes an update. This workflow builds, tests and signs the Windows and macOS packages and attaches
# them to a GitHub PRE-release. Employees see nothing until an administrator creates the release in the
# dashboard (Desktop app updates), tests it, and a Super Admin publishes it.
#
# Secrets and variables live in the GitHub Environment named by `environment` (staging or production),
# never in the repository. Each environment has its OWN updater key pair:
#   secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#            optional code signing: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8 (base64 .p8); AZURE_* for Windows Trusted Signing
#   vars:    WORKFOLIO_UPDATER_PUBKEY, WORKFOLIO_API_URL, WORKFOLIO_DASHBOARD_URL
name: Desktop release candidate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "staging (QA) or production"
        required: true
        type: choice
        options: [staging, production]
      version:
        description: "Version to build; must equal apps/desktop/src-tauri/tauri.conf.json"
        required: true
      macos_universal:
        description: "macOS: universal binary (Apple Silicon + Intel) instead of Apple Silicon only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.environment }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Build, tests, signing and installer verification live in desktop-build.yml (shared with desktop-publish.yml).
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      macos_universal: ${{ inputs.macos_universal }}
    secrets: inherit

  prerelease:
    name: Attach to a GitHub pre-release (not visible to employees)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-${{ inputs.environment }}-v${{ inputs.version }}
        run: |
          rm -f release/installer.json # per-platform build metadata (desktop-build.yml), not a release asset
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Desktop ${{ inputs.version }} (${{ inputs.environment }} candidate)" \
            --notes "Release candidate. Not offered to employees until published in the dashboard (Desktop app updates)."
          {
            echo "## Paste into the dashboard (Desktop app updates → New release ${{ inputs.version }})"
            for sig in release/*.sig; do
              f=$(basename "${sig%.sig}")
              echo "### $f"
              case "$f" in *darwin-universal*) echo "(use for both macOS Apple Silicon and macOS Intel)";; esac
              echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$f"
              echo '```'; cat "$sig"; echo; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
